<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Dashboard Uskup Surabaya</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        padding: 40px;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 20px;
      }

      h1 {
        color: #1e40af;
        margin-bottom: 16px;
        font-size: 24px;
      }

      p {
        color: #64748b;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      button {
        background: #1e40af;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #1d4ed8;
      }

      .brand {
        margin-top: 24px;
        color: #94a3b8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Anda Sedang Offline</h1>
      <p>
        Tidak dapat terhubung ke internet. Periksa koneksi Anda dan coba lagi.
      </p>
      <button onclick="window.location.reload()">Coba Lagi</button>
      <p class="brand">Dashboard Uskup Surabaya</p>
    </div>
  </body>
</html>
